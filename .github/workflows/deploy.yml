name: Deploy

on:
  push:
    branches:
      - main

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}

  deploy:
    runs-on: ubuntu-latest
    needs: build-and-push
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup SSH key
        env:
          SSH_KEY: ${{ secrets.SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          echo "$SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H ${{ secrets.SERVER_IP }} >> ~/.ssh/known_hosts

      - name: Apply manifests
        run: |
          {
            cat deploy/k8s/telegram-bot-config.yaml
            echo ---
            sed "s|${{ env.IMAGE }}:latest|${{ env.IMAGE }}:${{ github.sha }}|" \
              deploy/k8s/telegram-bot.yaml
          } | ssh deploy@${{ secrets.SERVER_IP }} \
                "KUBECONFIG=~/.kube/config kubectl apply -f -"

      - name: Wait for rollout
        run: |
          ssh deploy@${{ secrets.SERVER_IP }} \
            "KUBECONFIG=~/.kube/config kubectl rollout status deployment/telegram-bot --timeout=180s"

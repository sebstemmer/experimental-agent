- name: Setup experimental-agent server
  hosts: server
  become: true

  vars:
    deploy_user: deploy
    manifest_dir: /home/deploy/manifests

  tasks:
    - name: Update apt cache
      apt:
        update_cache: true

    - name: Install required packages
      apt:
        name:
          - ca-certificates
          - curl
        state: present

    - name: Create deploy user
      user:
        name: "{{ deploy_user }}"
        shell: /bin/bash

    - name: Create .ssh directory for deploy user
      file:
        path: "/home/{{ deploy_user }}/.ssh"
        state: directory
        owner: "{{ deploy_user }}"
        group: "{{ deploy_user }}"
        mode: "0700"

    - name: Copy GitHub Actions key to deploy user
      copy:
        src: github.pub
        dest: "/home/{{ deploy_user }}/.ssh/authorized_keys"
        owner: "{{ deploy_user }}"
        group: "{{ deploy_user }}"
        mode: "0600"

    - name: Install k3s
      shell: curl -sfL https://get.k3s.io | sh -s - --disable traefik --disable servicelb
      args:
        creates: /usr/local/bin/k3s

    - name: Wait for k3s API
      wait_for:
        port: 6443
        timeout: 120

    - name: Create .kube directory for deploy user
      file:
        path: "/home/{{ deploy_user }}/.kube"
        state: directory
        owner: "{{ deploy_user }}"
        group: "{{ deploy_user }}"
        mode: "0700"

    - name: Give deploy user its own kubeconfig
      copy:
        src: /etc/rancher/k3s/k3s.yaml
        dest: "/home/{{ deploy_user }}/.kube/config"
        remote_src: true
        owner: "{{ deploy_user }}"
        group: "{{ deploy_user }}"
        mode: "0600"

    - name: Create manifest directory
      file:
        path: "{{ manifest_dir }}"
        state: directory
        owner: "{{ deploy_user }}"
        group: "{{ deploy_user }}"
        mode: "0700"

    - name: Copy manifests from the local machine
      copy:
        src: "../k8s/{{ item }}"
        dest: "{{ manifest_dir }}/{{ item }}"
        owner: "{{ deploy_user }}"
        group: "{{ deploy_user }}"
        mode: "0600"
      loop:
        - postgres-config.yaml
        - postgres-pvc.yaml
        - postgres.yaml

    - name: Copy server secrets from the local machine
      copy:
        src: "../k8s/prod-secrets/{{ item }}"
        dest: "{{ manifest_dir }}/{{ item }}"
        owner: "{{ deploy_user }}"
        group: "{{ deploy_user }}"
        mode: "0600"
      loop:
        - postgres-credentials.yaml
        - telegram-bot-credentials.yaml
        - ghcr-credentials.yaml

    - name: Apply manifests
      shell: kubectl apply -f {{ manifest_dir }}/
      become_user: "{{ deploy_user }}"
      environment:
        KUBECONFIG: "/home/{{ deploy_user }}/.kube/config"
